name: CI

# Verifies, on every push/PR, that the engine (C++), the native addon (napi),
# the renderer (web), and full Electron packaging all still build cleanly on
# every OS Net Pulse ships for. This is also the transparency mechanism from
# CODE_SIGNING.md's "no certificate yet" interim plan: every commit's build
# log is public, so anyone can see exactly what compiled a given artifact —
# see release.yml for the actual signed/attested release build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Toolchain versions (diagnostic)
        shell: bash
        run: |
          node --version
          npm --version
          cmake --version

      # ---- 1) C++ engine: configure, build, run the unit test suite -------
      # `--config Release` / `-C Release` are harmless no-ops on the
      # single-config generators (Unix Makefiles) used on Linux/macOS and are
      # required on the multi-config generator (Visual Studio) used on
      # Windows — this one invocation works unmodified on all three.
      - name: Configure engine (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine + unit tests
        run: cmake --build build --config Release

      - name: Run unit tests (netpulse_tests)
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- 2) Native Node-API addon, built for the installed Electron's ABI
      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Install napi deps
        working-directory: napi
        run: npm ci

      - name: Build native addon for Electron ABI
        working-directory: napi
        run: npm run build:electron

      # ---- 3) React renderer -------------------------------------------
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build renderer
        working-directory: web
        run: npm run build

      # ---- 4) Full Electron packaging smoke test -------------------------
      # --dir skips installer/signing steps (no CSC_LINK in CI) but exercises
      # every path electron-builder.yml declares — icons, entitlements,
      # extraResources (web/dist, napi addon) — so a broken packaging config
      # fails CI on every PR instead of only being discovered at release time.
      - name: Package (unpacked, unsigned smoke test)
        working-directory: electron
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
