name: Release

# Builds signed-if-possible, checksummed, and PUBLICLY ATTESTED installers for
# Windows / macOS / Linux from a single tag push, and publishes them as a
# GitHub Release. This is the "make users feel safe with zero signing budget"
# plan from CODE_SIGNING.md's interim section:
#   1. The build is fully automated and public (this file) — anyone can read
#      exactly what compiled a given artifact instead of trusting a claim.
#   2. Every artifact gets a GitHub-issued build-provenance attestation
#      (actions/attest-build-provenance) — a free, cryptographically verifiable
#      statement of "this exact file was built by this exact workflow run from
#      this exact commit," checkable with `gh attestation verify` even before
#      any paid code-signing certificate exists.
#   3. A SHA256SUMS manifest is published alongside the installers so anyone
#      can confirm their download is byte-identical to what CI produced.
#   4. If CSC_LINK/CSC_KEY_PASSWORD (Windows/macOS) secrets are ever added later
#      (once a certificate is obtained), this same workflow starts producing
#      genuinely signed artifacts with no other change — see the `env:` blocks
#      below, which are no-ops today (unset secrets) and become live signing
#      the moment the secrets exist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for (defaults to the ref that triggered this run)'
        required: false

permissions:
  contents: write        # create the GitHub Release and upload assets
  id-token: write         # required for keyless build-provenance attestation
  attestations: write     # required to publish build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release build mid-way through publishing

jobs:
  build:
    name: build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_script: dist:win
            artifact_name: windows-installer
          - os: macos-latest
            dist_script: dist:mac
            artifact_name: macos-installer
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_name: linux-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- Engine + addon + renderer, same order as a local release build --
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build renderer
        working-directory: web
        run: npm run build

      - name: Install electron deps (needed to detect the Electron ABI)
        working-directory: electron
        run: npm ci

      - name: Install napi deps
        working-directory: napi
        run: npm ci

      - name: Build native addon for Electron ABI
        working-directory: napi
        run: npm run build:electron

      # ---- Prepare electron-builder's buildResources dir ------------------
      # electron/build/ is intentionally gitignored (it's also where local
      # dev builds dump other output), so the icons + entitlements that live
      # there locally never reach the runner via checkout. Reconstruct just
      # the files electron-builder.yml actually needs, straight from the
      # already-tracked, canonical source assets in /branding.
      - name: Prepare electron build resources
        shell: bash
        run: |
          mkdir -p electron/build
          cp branding/icon.ico electron/build/icon.ico
          cp branding/icon.png electron/build/icon.png

      # ---- Package + sign-if-possible ------------------------------------
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from
      # searching the runner's local keychain/cert store for a signing
      # identity it will never find in CI — without this, macOS builds in
      # particular can fail outright instead of falling back to unsigned.
      #
      # IMPORTANT: these vars must be genuinely ABSENT when no cert secret is
      # configured, not present-but-empty. `env: CSC_LINK: ${{ secrets.X }}`
      # sets CSC_LINK="" when the secret doesn't exist — electron-builder's
      # macOS signing path then does path.resolve('') on that empty string,
      # which Node.js resolves to the current working directory, and fails
      # trying to stat that directory as a signing certificate file. Exporting
      # conditionally via GITHUB_ENV avoids ever setting an empty CSC_LINK.
      - name: Set signing env (only if secrets are configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      # If CSC_LINK/CSC_KEY_PASSWORD secrets are configured in the repo (once
      # a certificate exists — see CODE_SIGNING.md) they're picked up above and
      # the build becomes genuinely signed with no other change needed here.
      - name: Package installer
        working-directory: electron
        run: npm run ${{ matrix.dist_script }}

      - name: List produced artifacts (diagnostic)
        shell: bash
        run: ls -la release/

      # Only ship actual installers/archives, not electron-builder's
      # intermediate unpacked-app directories or debug metadata (*.yml,
      # builder-effective-config.yaml, etc).
      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p collected
          shopt -s nullglob
          cp -v release/*.exe release/*.blockmap release/*.dmg release/*.zip \
                release/*.AppImage release/*.deb collected/ 2>/dev/null || true
          ls -la collected

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: collected/*
          if-no-files-found: error

  publish:
    name: checksum, attest, and publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` conditions can't reference `secrets.*` directly
      # (GitHub Actions doesn't expose the secrets context there) — mirror
      # the one bit we need ("is a key configured") into a plain job env var
      # instead, decided once at job level where `secrets.*` IS accessible.
      HAS_GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-installer'
          merge-multiple: true

      - name: List downloaded artifacts (diagnostic)
        run: ls -la release/

      - name: Generate SHA256SUMS.txt
        run: node .github/scripts/checksums.mjs release release/SHA256SUMS.txt

      - name: GPG-sign SHA256SUMS.txt (only if a signing key secret is configured)
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output release/SHA256SUMS.txt.asc release/SHA256SUMS.txt

      # Free, GitHub-native "who built this" proof — a cryptographically
      # verifiable statement tying every published file to this exact
      # workflow run and commit SHA. Doesn't require any certificate; this is
      # the "let users verify the exact code that compiled the binary" ask.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release/*'

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Net Pulse — Open Net Tools ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          body: |
            **Unsigned build notice:** this project does not yet have a paid
            code-signing certificate (Windows Authenticode / Apple Developer
            ID) — see [`CODE_SIGNING.md`](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)
            for why, and for the plan to add one. Windows SmartScreen and
            macOS Gatekeeper will show a warning on first run; this is
            expected for an unsigned free/open-source app and is not a
            statement about the app's safety.

            To verify what you downloaded:
            - **Checksums:** compare against `SHA256SUMS.txt` in this release.
            - **Build provenance:** every file here carries a GitHub
              attestation proving it was built by this exact public workflow
              run from this exact commit — verify with:
              `gh attestation verify <downloaded-file> --owner ${{ github.repository_owner }}`
            - **Source:** this entire build is reproducible from the public
              workflow at `.github/workflows/release.yml` in this repository.