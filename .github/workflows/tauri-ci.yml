name: Tauri CI

# Verifies, on every push/PR, that the C++ engine's own unit tests pass, the
# React frontend builds, and the full Tauri app (Rust host + statically
# linked C++ engine via cxx, no .node/.so/.dylib addon) builds and packages
# cleanly on every OS Net Pulse ships for. Replaces the old ci.yml, which
# built the now-retired Electron/napi app instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: C++ engine + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure engine (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine + unit tests
        run: cmake --build build --config Release

      - name: Run unit tests (netpulse_tests)
        run: ctest --test-dir build -C Release --output-on-failure

      # FEATURE: the CLI (cli/, target `npulse`) is built automatically by
      # the step above already — NETPULSE_BUILD_CLI defaults ON in the
      # top-level CMakeLists.txt precisely so a plain `cmake --build`
      # produces it with no extra flags, here included. This step is a
      # cheap, real smoke test on top of that: confirm the binary actually
      # runs and dispatches its subcommands correctly on every OS, not just
      # that it links. `ifconfig` and `help` need no network and no
      # elevated privileges, so they're safe to run unconditionally in CI
      # regardless of the runner's own network/privilege posture.
      - name: Smoke-test the CLI (npulse)
        shell: bash
        run: |
          BIN=$(find build -name 'npulse*' -type f \( -perm -u+x -o -name '*.exe' \) | head -1)
          echo "Testing $BIN"
          "$BIN" help
          "$BIN" ifconfig

  tauri:
    name: Tauri app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Toolchain versions (diagnostic)
        shell: bash
        run: |
          node --version
          npm --version
          cmake --version
          rustc --version
          cargo --version

      - name: Install frontend deps
        working-directory: tauri-app
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: tauri-app
        run: npm run build

      # ---- Rust: check, release build, unit tests ------------------------
      - name: cargo check
        working-directory: tauri-app/src-tauri
        run: cargo check

      - name: cargo build --release (statically links the C++ engine via cxx — no .node/.so/.dylib addon)
        working-directory: tauri-app/src-tauri
        run: cargo build --release

      - name: cargo test
        working-directory: tauri-app/src-tauri
        run: cargo test

      # ---- Full Tauri packaging smoke test -------------------------------
      - name: Install Tauri CLI
        working-directory: tauri-app
        run: npm install --no-save @tauri-apps/cli

      # FEATURE: builds the same CLI sidecar the release workflow bundles
      # into real installers (see tauri-release.yml's identically-named
      # step and tauri-app/src-tauri/binaries/README.md for the full
      # convention) so this job's packaging smoke test below actually
      # exercises the externalBin path too, not just the main app bundle —
      # a config mistake there would otherwise only surface on a real
      # tagged release, the worst possible place to find it for the first
      # time.
      - name: Build CLI sidecar (npulse)
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          cmake -S . -B build-cli -DCMAKE_BUILD_TYPE=Release -DNETPULSE_CLI_SIDECAR_TRIPLE="$TRIPLE"
          cmake --build build-cli --config Release --target npulse
          mkdir -p tauri-app/src-tauri/binaries
          # `find`, not a hardcoded path: a multi-config generator (Visual
          # Studio, CMake's default on windows-latest) nests output under
          # an extra Release/ directory a single-config generator
          # (Makefiles/Ninja, the Linux/macOS default) doesn't — same
          # reasoning tauri-release.yml's own "Collect installer files"
          # step already uses for the analogous Cargo target/<triple>/
          # nesting difference.
          SIDECAR=$(find build-cli -name "npulse-${TRIPLE}*" -type f)
          echo "Sidecar: $SIDECAR"
          cp "$SIDECAR" tauri-app/src-tauri/binaries/

      - name: tauri build (packaging smoke test)
        working-directory: tauri-app
        shell: bash
        # --config overrides createUpdaterArtifacts for JUST this invocation
        # (Tauri merges it over the real tauri.conf.json via JSON Merge
        # Patch) — this step exists to confirm packaging succeeds, not to
        # produce a real signed distributable, so it has no business
        # requiring TAURI_SIGNING_PRIVATE_KEY (which, correctly, isn't set
        # here — that's tauri-release.yml's job). Without this, the base
        # config's updater pubkey (needed for real releases) makes ANY bare
        # `tauri build` fail with "a public key has been found, but no
        # private key", on every OS in the matrix, which is exactly what
        # this step was doing before this fix.
        #
        # Forced to bash explicitly (this job's other steps use whatever
        # GitHub's default shell is per OS — bash on ubuntu/macos, but
        # pwsh on windows-latest) so this exact command runs identically on
        # every matrix OS, rather than depending on the embedded JSON's
        # double-quotes surviving PowerShell's own argument reconstruction
        # for an external process — a real inconsistency to design around,
        # not something to assume just works.
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'