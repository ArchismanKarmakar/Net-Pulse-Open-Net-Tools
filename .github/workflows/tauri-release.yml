name: Tauri Release

# Builds signed-if-possible, checksummed, and PUBLICLY ATTESTED installers for
# Windows / macOS / Linux from a single tag push, and publishes them as a
# GitHub Release. Replaces the old Electron-builder-based release.yml.
# Reuses the same "make users feel safe with zero signing budget" plan from
# CODE_SIGNING.md's interim section:
#   1. The build is fully automated and public (this file) — anyone can read
#      exactly what compiled a given artifact instead of trusting a claim.
#   2. Every artifact gets a GitHub-issued build-provenance attestation
#      (actions/attest-build-provenance) — a free, cryptographically verifiable
#      statement of "this exact file was built by this exact workflow run from
#      this exact commit," checkable with `gh attestation verify` even before
#      any paid code-signing certificate exists.
#   3. A SHA256SUMS manifest is published alongside the installers so anyone
#      can confirm their download is byte-identical to what CI produced.
#   4. If the Tauri-equivalent signing secrets are ever added later (once a
#      certificate is obtained), tauri-action picks them up automatically —
#      see the build job's "Set signing env" step below. If they're not
#      configured, the build still succeeds unsigned, and the "Diagnose
#      per-OS updater artifact presence" step says so explicitly rather
#      than leaving that as a silent gap.

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for (defaults to the ref that triggered this run)'
        required: false

permissions:
  contents: write        # create the GitHub Release and upload assets
  id-token: write         # required for keyless build-provenance attestation
  attestations: write     # required to publish build-provenance attestation

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release build mid-way through publishing

jobs:
  build:
    name: build installer (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # BUG FIX: macOS used to be a single 'macos-latest' entry building
      # `--target universal-apple-darwin` — but real CI runs proved that
      # combination genuinely doesn't produce updater artifacts (repeatedly
      # confirmed: signing succeeds, the raw .app and the .dmg both build
      # fine, but the bundler's own "Bundling .../.app.tar.gz (updater)"
      # step never runs at all, regardless of the tauri.conf.json `targets`
      # array's contents or order — two different config changes here were
      # each tested against real macOS CI runs and neither changed this
      # bundler behavior even slightly, which is what ruled out a config
      # problem and pointed at the universal-build path itself). Switched
      # to tauri-action's own official example workflow pattern instead
      # (see its README) — two separate architecture-specific macOS jobs,
      # not one universal one. Trade-off: this ships an aarch64 .dmg and an
      # x86_64 .dmg as two separate downloads rather than one universal
      # file that runs on both — a real trade-off, but one an official,
      # documented, working pattern makes, rather than a workaround for an
      # unconfirmed bundler bug.
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-latest
            target_args: ''
            rust_target: ''
          - os: macos-latest
            artifact_name: macos-aarch64
            # BUG FIX: explicit --bundles, alongside --target, not just
            # relying on tauri.conf.json's own `targets` array — a recent
            # (Nov 2025), confirmed-working real CI config for this exact
            # scenario (separate arch-specific macOS jobs, updater
            # artifacts required) passes bundles this way explicitly.
            # `targets` array changes alone (adding "app", reordering it
            # before "dmg") were both tried against real CI runs first and
            # neither changed this warning at all — this is a genuinely
            # different mechanism, not another variation of the same one.
            target_args: '--target aarch64-apple-darwin --bundles dmg,app'
            rust_target: 'aarch64-apple-darwin'
          - os: macos-latest
            artifact_name: macos-x86_64
            target_args: '--target x86_64-apple-darwin --bundles dmg,app'
            rust_target: 'x86_64-apple-darwin'
          - os: ubuntu-latest
            artifact_name: ubuntu-latest
            target_args: ''
            rust_target: ''
    # See obfuscated-build.yml's identical env block for the full reasoning
    # — this is the actual release build, so this fix matters here most of
    # all: without it, every macOS release binary links against whatever
    # deployment-target default the aarch64-apple-darwin/x86_64-apple-
    # darwin rustc target happens to have, not the 10.15 tauri.conf.json's
    # own `macOS.minimumSystemVersion` claims the app supports.
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      # Same pattern as the publish job's own HAS_GPG_KEY/HAS_SIGNING_KEY —
      # needed here too now, for the new per-OS signing diagnostic below.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # BUG FIX: this used to have no `ref:` at all, meaning the
          # checkout always used whatever the triggering ref happened to
          # be -- for a plain tag push that IS the tag, correctly, but for
          # the workflow_dispatch path this file's own header comment
          # documents ("Existing tag to (re)build a release for"), the
          # dispatch is issued against `main` (see tauri-version-
          # release.yml's own dispatch call: `--ref main`), so this
          # silently built whatever main's CURRENT head looked like on
          # every workflow_dispatch run, not the actual historical tagged
          # commit -- a real correctness bug for the one scenario this
          # input exists to support at all. Explicit now: the tag when
          # one was given, falling back to whatever ref actually triggered
          # this run otherwise (a plain tag push).
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Linux webview + packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # BUG FIX: this used to unconditionally install BOTH aarch64 and
          # x86_64 targets whenever matrix.os == 'macos-latest', because a
          # single job built both via --target universal-apple-darwin. Now
          # that macOS is two separate, architecture-specific jobs (see the
          # matrix's own doc comment above for why), each job only needs
          # its own single target — matrix.rust_target is empty for
          # Windows/Linux (rustup's default host target is already correct
          # there) and set to exactly one Darwin target per macOS job.
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install frontend deps
        working-directory: tauri-app
        run: npm ci

      - name: Set signing env (only if secrets are configured)
        shell: bash
        run: |
          # A plain `echo "KEY=$VALUE" >> $GITHUB_ENV` silently breaks for a
          # multi-line value — GitHub's env-file format parses each line as
          # its own KEY=value pair, so a value containing a newline either
          # gets truncated to its first line or corrupts the file outright.
          # Tauri's signing private key is exactly this shape (an
          # "untrusted comment: ..." header line followed by the actual key
          # data on its own line) — this is almost certainly why the build
          # reported "no private key" even with TAURI_SIGNING_PRIVATE_KEY
          # genuinely set as a repository secret. Using GitHub's own
          # documented heredoc syntax for every secret here, not just the
          # one confirmed multi-line one, so this can't recur if a
          # certificate secret is ever stored un-encoded instead of as the
          # conventional base64 blob.
          set_multiline_env() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              echo "${name}<<TAURI_ENV_EOF" >> "$GITHUB_ENV"
              echo "$value" >> "$GITHUB_ENV"
              echo "TAURI_ENV_EOF" >> "$GITHUB_ENV"
            fi
          }
          set_multiline_env TAURI_SIGNING_PRIVATE_KEY "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          set_multiline_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          set_multiline_env APPLE_CERTIFICATE "${{ secrets.APPLE_CERTIFICATE }}"
          set_multiline_env APPLE_CERTIFICATE_PASSWORD "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          set_multiline_env APPLE_ID "${{ secrets.APPLE_ID }}"
          set_multiline_env APPLE_PASSWORD "${{ secrets.APPLE_PASSWORD }}"
          set_multiline_env APPLE_TEAM_ID "${{ secrets.APPLE_TEAM_ID }}"
          set_multiline_env WINDOWS_CERTIFICATE "${{ secrets.WINDOWS_CERTIFICATE }}"
          set_multiline_env WINDOWS_CERTIFICATE_PASSWORD "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"

      # FEATURE: diagnoses, on THIS step rather than several minutes and
      # three OS jobs later at the merge step, whether TAURI_SIGNING_
      # PRIVATE_KEY actually reached this job at all — never prints the
      # key itself, only whether it's present/non-empty and how long it is
      # (a real minisign private key is a predictable, multi-hundred-
      # character block; a suspiciously short "present" value usually
      # means something got truncated or pasted wrong, not that it's
      # missing entirely). The single most common reason a secret that is
      # genuinely configured in the repo still shows up empty HERE: GitHub
      # has two different secret scopes — plain repository-level secrets
      # (Settings → Secrets and variables → Actions) and per-Environment
      # secrets (Settings → Environments → <name> → Secrets) — and an
      # Environment secret is ONLY visible to a job that explicitly opts
      # into that environment via `environment: <name>` at the job level.
      # This workflow's jobs don't declare one (deliberately not guessed
      # here — getting an environment name wrong can be worse than not
      # setting one at all, since some environments have required-reviewer
      # protection rules that would pause the whole run waiting for
      # approval) — so if the key was configured under Environments rather
      # than plain Actions secrets, this step is what will make that
      # visible immediately, rather than the confusing "it's configured
      # but nothing worked" symptom a live report described.
      - name: Diagnose signing key visibility (no secret values ever printed)
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is NOT visible to this job. If it's genuinely configured in the repo, the most common cause is that it's set as an ENVIRONMENT secret (Settings -> Environments -> <name> -> Secrets) rather than a plain repository Actions secret (Settings -> Secrets and variables -> Actions) — Environment secrets are only visible to a job that declares 'environment: <name>', which this workflow's jobs currently don't. Updater artifacts will not be produced this run."
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is visible to this job (length: ${#TAURI_SIGNING_PRIVATE_KEY} characters)."
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set — fine if the key was generated without a password; Tauri treats an empty password as 'no password', not an error."
          fi

      # ---- Package + sign-if-possible ------------------------------------
      # BUG FIX: this used to omit tagName/releaseId entirely ("build-only
      # mode"), on the theory that latest.json was something `tauri build`
      # itself produces locally on disk (createUpdaterArtifacts: true),
      # which this step's own "Collect installer files" step further down
      # could just find and copy — same as any other bundle output. That
      # theory was wrong, confirmed directly against tauri-action's own
      # source (upload-version-json.ts): latest.json is constructed BY
      # tauri-action ITSELF, entirely in memory, only as part of its own
      # upload-to-release logic — `tauri build` never writes it to disk at
      # all, regardless of whether signing succeeded. A real build log
      # proved this precisely: signing genuinely succeeded ("Finished 1
      # updater signature at ...exe.sig"), yet tauri-action's own very next
      # line was "No releaseId or tagName provided, skipping all
      # uploads..." — the exact, documented message tauri-action's README
      # says appears when tagName/releaseId are both omitted, which is
      # deliberately what "build-only mode" does. No version of the signing
      # key, its password, or the merge script downstream could ever have
      # produced a latest.json under the old setup, because tauri-action's
      # own manifest-generation code path was never being reached at all.
      #
      # Fixed by giving tauri-action what its own documented pattern for a
      # multi-OS matrix release requires: GITHUB_TOKEN plus tagName, with
      # releaseDraft: true so the three concurrent OS jobs safely share one
      # not-yet-public release rather than each trying to publish
      # separately. tauri-action finds-or-creates that draft release itself
      # and merges each platform's entry into one real, multi-platform
      # latest.json natively — the exact job this workflow's own custom
      # merge-latest-json.mjs script was trying to reimplement, and could
      # never succeed at no matter how correct its own logic was, since it
      # depended on a local latest.json file that was never going to exist.
      - name: tauri-action build
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Net Pulse — Open Net Tools ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Set once here (all three concurrent OS jobs pass the same,
          # identical text, so whichever one's request actually "wins" the
          # release-creation race produces the same result either way) —
          # keeps the publish job below from needing its own separate
          # step just to set the body on a release that already exists.
          releaseBody: |
            **Unsigned build notice:** this project does not yet have a paid
            code-signing certificate (Windows Authenticode / Apple Developer
            ID) — see [`CODE_SIGNING.md`](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)
            for why, and for the plan to add one. Windows SmartScreen and
            macOS Gatekeeper will show a warning on first run; this is
            expected for an unsigned free/open-source app and is not a
            statement about the app's safety.

            To verify what you downloaded:
            - **Checksums:** compare against `SHA256SUMS.txt` in this release.
            - **Build provenance:** every file here carries a GitHub
              attestation proving it was built by this exact public workflow
              run from this exact commit — verify with:
              `gh attestation verify <downloaded-file> --owner ${{ github.repository_owner }}`
            - **Source:** this entire build is reproducible from the public
              workflow at `.github/workflows/tauri-release.yml` in this repository.
          # BUG FIX: this used to build a single universal-apple-darwin
          # binary for macOS, which real CI runs proved doesn't reliably
          # produce updater artifacts (see the matrix strategy's own doc
          # comment above for the full evidence). matrix.target_args now
          # directly carries each job's own architecture flag plus, for
          # the two macOS jobs specifically, an explicit '--bundles
          # dmg,app' (see the matrix's own doc comment on those two
          # entries for why that's there, not just tauri.conf.json's
          # `targets` array) — empty for Windows/Linux.
          args: ${{ matrix.target_args }}

      # BUG FIX: this used to search the LOCAL bundle directory
      # (tauri-app/src-tauri/target/release/bundle) for latest.json — which
      # can never find it, with or without a signing key, since (see the
      # "tauri-action build" step's own doc comment above) latest.json is
      # never written to disk at all; tauri-action constructs and uploads
      # it entirely in memory, directly to the release. This would have
      # reported "missing" on every single run regardless of whether
      # signing actually worked. Checking the release itself now, via the
      # same GITHUB_TOKEN the build step already has, which is what
      # actually reflects whether tauri-action's own upload succeeded.
      - name: Diagnose per-OS updater artifact presence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.json'; then
            echo "latest.json IS present on the draft release — tauri-action's own upload for ${{ matrix.artifact_name }} succeeded (or an earlier matrix job's did; this file is shared across the whole release, not per-job)."
          elif [ "${{ env.HAS_SIGNING_KEY }}" != "true" ]; then
            echo "::notice::No latest.json on the release yet — expected, no TAURI_SIGNING_PRIVATE_KEY is configured (see CODE_SIGNING.md)."
          else
            echo "::warning::No latest.json on the release even though TAURI_SIGNING_PRIVATE_KEY IS configured. Likely causes: (1) the key requires a password and TAURI_SIGNING_PRIVATE_KEY_PASSWORD is wrong or missing (currently set: ${{ env.HAS_SIGNING_PASSWORD }}) — Tauri only treats a genuinely EMPTY password as valid for a key that was generated WITHOUT one. (2) the private key doesn't match tauri.conf.json's updater.pubkey. (3) the secret's encoding got mangled in transit — regenerate and re-paste via 'gh secret set TAURI_SIGNING_PRIVATE_KEY < path/to/key'. Search the 'tauri-action build' step's own log above for 'sign' for the actual error if one occurred."
          fi

      - name: List produced bundle artifacts (diagnostic)
        shell: bash
        run: find tauri-app/src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      # Ship installers/archives and their .sig signature files (not
      # latest.json — see the "tauri-action build" step's own doc comment
      # for why that's never a local file at all: tauri-action uploads it
      # directly to the draft release in memory, and it's pulled from
      # there in the publish job below instead) and not intermediate
      # unpacked-app directories or debug metadata.
      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p collected
          shopt -s nullglob
          find tauri-app/src-tauri/target/release/bundle \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -type f -exec cp -v {} collected/ \;
          find tauri-app/src-tauri/target/release/bundle -name '*.sig' -type f \
            -exec cp -v {} collected/ \;
          ls -la collected

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # BUG FIX: this used to be matrix.os-based ('macos-latest-
          # installer') — harmless with one job per OS, but with macOS now
          # split into two architecture-specific jobs sharing the same
          # matrix.os value, both would upload to the identical artifact
          # name and collide (actions/upload-artifact rejects a duplicate
          # name outright rather than silently merging or overwriting).
          # matrix.artifact_name is unique per job across the whole matrix.
          name: ${{ matrix.artifact_name }}-installer
          path: collected/*
          if-no-files-found: error

  publish:
    name: checksum, attest, and publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` conditions can't reference `secrets.*` directly
      # (GitHub Actions doesn't expose the secrets context there) — mirror
      # the one bit we need ("is a key configured") into a plain job env var
      # instead, decided once at job level where `secrets.*` IS accessible.
      HAS_GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
      # CODE_SIGNING.md is explicit that this project doesn't have a real
      # signing key configured yet ("future implementation"), which used to
      # mean createUpdaterArtifacts genuinely couldn't produce a latest.json
      # on any of the three OS jobs — not a bug, the documented, current
      # state of the project at the time. Kept for the "download latest.json"
      # step below, which needs to tell apart "genuinely no key configured,
      # so no manifest exists on the release at all" (expected, continue
      # without one) from "a key IS configured but the release still has no
      # manifest" (a real, unexpected problem worth failing loudly over).
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Same fix as the build job's checkout above -- this job also
          # needs the tag's own commit (e.g. its CODE_SIGNING.md content
          # referenced in the release body below), not whatever ref
          # happened to trigger the run.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-installer'
          merge-multiple: true

      - name: List downloaded artifacts (diagnostic)
        run: ls -la release/

      # BUG FIX: this step used to run a custom script (merge-latest-
      # json.mjs) that combined each OS's own single-platform latest.json —
      # collected as a workflow artifact by the build job — into one real,
      # multi-platform manifest. That script's own logic was correct, but
      # it was solving a problem that no longer exists the way it assumed:
      # latest.json was never a file `tauri build` writes to disk at all
      # (confirmed against tauri-action's own source — see the "tauri-
      # action build" step's doc comment above), so there was never
      # anything for the build job to collect as a workflow artifact in
      # the first place, regardless of whether signing succeeded. Now that
      # the build job gives tauri-action a real tagName + GITHUB_TOKEN,
      # tauri-action itself creates the draft release and merges every
      # platform's entry into ONE real latest.json there, natively, as
      # each of the three matrix jobs finishes — this step just downloads
      # that already-correct file, rather than trying to reconstruct it
      # from parts that were never actually collected.
      - name: Download latest.json from the draft release (if signing produced one)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download "${{ inputs.tag || github.ref_name }}" \
              --repo "${{ github.repository }}" --pattern 'latest.json' --dir release --clobber 2>/dev/null; then
            echo "Downloaded latest.json from the draft release."
          elif [ "${{ env.HAS_SIGNING_KEY }}" != "true" ]; then
            echo "No latest.json on the release — expected, no TAURI_SIGNING_PRIVATE_KEY is configured (see CODE_SIGNING.md). Installers will still publish; auto-update is unavailable until signing is set up."
          else
            echo "::warning::No latest.json on the release even though TAURI_SIGNING_PRIVATE_KEY IS configured — see the build jobs' own 'Diagnose per-OS updater artifact presence' step for the likely cause (password mismatch, key/pubkey mismatch, or secret corruption)."
          fi

      - name: Generate SHA256SUMS.txt
        run: node .github/scripts/checksums.mjs release release/SHA256SUMS.txt

      - name: GPG-sign SHA256SUMS.txt (only if a signing key secret is configured)
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output release/SHA256SUMS.txt.asc release/SHA256SUMS.txt

      # Free, GitHub-native "who built this" proof — a cryptographically
      # verifiable statement tying every published file to this exact
      # workflow run and commit SHA. Doesn't require any certificate; this is
      # the "let users verify the exact code that compiled the binary" ask.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release/*'

      # BUG FIX: this used to be softprops/action-gh-release@v2, whose job
      # was to CREATE the release — but the build job now already created
      # it (as a draft, via tauri-action) before this job ever runs. Asking
      # a second, different tool to "create or update" the same tag's
      # release has real, documented failure modes for exactly this
      # scenario (softprops/action-gh-release issues #445 and #403, both
      # "Validation Failed: already_exists" against a release created by
      # something else) — and the fix for reusing an existing draft
      # release correctly only landed in v3.0.2; this file was pinned to
      # v2, which predates it. Rather than carry that risk into a step
      # that's the last thing standing between a build and a public
      # release, using the official `gh` CLI directly instead: `gh release
      # upload` unambiguously operates on an release that must already
      # exist (no create-vs-update ambiguity at all), and `gh release
      # edit --draft=false` is the well-established, reliable way to
      # publish a draft. Both are pre-installed on every GitHub-hosted
      # runner. The release body was already set once, on creation, by the
      # build job's own tauri-action call (see its releaseBody input) —
      # no need to set it a second time here.
      - name: Upload checksums/attestation files and publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" release/SHA256SUMS.txt* \
            --repo "${{ github.repository }}" --clobber
          gh release edit "${{ inputs.tag || github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false --prerelease=false