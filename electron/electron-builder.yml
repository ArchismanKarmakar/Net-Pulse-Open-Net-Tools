# electron-builder configuration for producing SIGNED, distributable installers.
#
# Trust note: a clean AV / SmartScreen / VirusTotal result requires the produced
# artifacts to be CODE-SIGNED (and, on macOS, notarized). This config wires the
# signing in via standard environment variables so no secret ever lives in the
# repo:
#
#   Windows (Authenticode):   CSC_LINK=<path-or-base64 .pfx>  CSC_KEY_PASSWORD=<pw>
#                             (EV certs on an HSM/token: set win.signtoolOptions or
#                              a custom sign hook per your CA's tooling.)
#   macOS   (Developer ID):   CSC_LINK / CSC_KEY_PASSWORD  + notarization:
#                             APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Without those variables the build still succeeds but the output is UNSIGNED
# (expect SmartScreen/AV warnings until signed — see SECURITY.md).

appId: com.archismankarmakar.netpulse.opennettools
productName: Net Pulse — Open Net Tools
copyright: Copyright (C) 2026 Archisman Karmakar — AGPL-3.0-or-later

directories:
  buildResources: build
  output: ../release

# Deterministic, non-obfuscated packaging (never pack with UPX etc. — packers are
# a top AV false-positive trigger).
asar: true
compression: normal
npmRebuild: false

# The app itself (goes into app.asar).
files:
  - main.js
  - preload.js
  - package.json
  - "!**/*.map"

# Prebuilt UI + native engine shipped as plain resources (the .node addon must
# live outside the asar so it can be dlopen'd; the paths match main.js:
#   distDir()  -> resources/web/dist
#   loadEngine -> resources/napi  (require -> index.js -> build/Release/*.node)
extraResources:
  - from: ../web/dist
    to: web/dist
  - from: ../napi/index.js
    to: napi/index.js
  - from: ../napi/package.json
    to: napi/package.json
  - from: ../napi/build/Release
    to: napi/build/Release
    filter: ["*.node"]
  - from: ../LICENSE
    to: LICENSE
  - from: ../COPYRIGHT
    to: COPYRIGHT

# ── Windows ────────────────────────────────────────────────────────────────
win:
  icon: build/icon.ico
  # publisherName must match the CN of your code-signing certificate.
  publisherName: Archisman Karmakar
  legalTrademarks: ""
  verifyUpdateCodeSignature: true
  # Sign with SHA-256 and RFC-3161 timestamp (Authenticode best practice).
  signtoolOptions:
    signingHashAlgorithms: ["sha256"]
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # A per-user install avoids forcing UAC for install; raw-ICMP mode still needs
  # the app itself run as Administrator at runtime (documented in the UI/README).

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Set env (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID) to notarize.
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

# ── Linux ──────────────────────────────────────────────────────────────────
linux:
  icon: build/icon.png
  category: Network
  synopsis: Path-latency & network diagnostics
  target:
    - AppImage
    - deb
